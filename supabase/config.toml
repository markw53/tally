# Supabase CLI project config. Only the bits Tally needs are set here; the
# rest come from the CLI's defaults.
#
# Replace project_id with your own (Dashboard -> Project Settings -> General).

project_id = "tally"

[functions.off]
# Off, but the function is NOT open: it checks the caller's token against
# GoTrue itself, in index.ts, and refuses anyone who isn't signed in.
#
# The platform's own check is the thing that can't be used here. It only
# understands the legacy HS256 key format, so on a project using the newer
# asymmetric signing keys — the default for new projects — it returns 401 for
# valid access tokens before the function runs, with no logs to explain why.
# Checking inside the function works with either key format.
verify_jwt = false

[functions.activity]
# Off deliberately. An iOS Shortcut cannot refresh a JWT unattended, so this
# function authenticates its own way — a hashed device key, checked against
# device_keys. The function is public; the key is what isn't.
verify_jwt = false
